[workspace]
resolver = "3"
members = ["crates/acnh-mouth", "crates/acnh-ui-smoke"]
default-members = ["crates/acnh-mouth", "crates/acnh-ui-smoke"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[workspace.dependencies]
skyline = "0.6.0"
nookkit = { git = "https://github.com/acnhmodding/nookkit", package = "nookkit" }
native-vtable = { git = "https://github.com/crackheadakira/vtable-rs" }
